  <!-- wordmark -->
  <g fill="#F3F8F2" transform="translate(36,7)">
    <text x="0" y="16" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="700" font-size="16" fill="#F3F8F2">ZIGAMA</text>
    <text x="76" y="16" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="600" font-size="12" fill="#C9A227">CSS</text>
