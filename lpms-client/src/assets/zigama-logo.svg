<?xml version="1.0" encoding="UTF-8"?>
<svg width="140" height="32" viewBox="0 0 140 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZIGAMA CSS">
  <!-- Simple placeholder logo approximating Zigama brand colors -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E8750"/>
      <stop offset="100%" stop-color="#176C46"/>
    </linearGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(0,2)">
