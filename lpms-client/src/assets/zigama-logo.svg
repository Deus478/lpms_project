    <path d="M8 19c4.5-1 7-4.5 8-9 2 4 1.5 9-3 12" stroke="#F3F8F2" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="21" cy="7" r="2" fill="#C9A227"/>
