<div class="contract-list">
  <!-- Header -->
  <div class="bg-white rounded-lg shadow-md p-6 mb-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-900">Contract Management</h2>
      <div class="flex space-x-3">
        <button 
          (click)="getContractsDueForRenewal()"
          class="px-4 py-2 bg-orange-600 text-white rounded-md hover:bg-orange-700 transition-colors"
        >
          🔄 Due for Renewal
        </button>
        <button 
          (click)="createContract()"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
        >
          ➕ New Contract
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
        <input 
          type="text" 
          [(ngModel)]="searchTerm"
          placeholder="Search contracts..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
        <select 
          [(ngModel)]="selectedStatus"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="all">All Statuses</option>
          <option value="draft">Draft</option>
          <option value="under review">Under Review</option>
          <option value="approved">Approved</option>
          <option value="executed">Executed</option>
          <option value="active">Active</option>
          <option value="expired">Expired</option>
          <option value="terminated">Terminated</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Contracts Grid -->
  <div *ngIf="!loading && !error" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
    <div 
      *ngFor="let contract of getFilteredContracts()" 
      class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow cursor-pointer"
      (click)="viewContract(contract)"
    >
      <div class="p-6 border-b border-gray-200">
        <div class="flex justify-between items-start mb-3">
          <h3 class="text-lg font-semibold text-gray-900 truncate">{{ contract.title }}</h3>
          <span 
            class="px-2 py-1 text-xs font-medium rounded-full"
            [class]="getStatusClass(contract.status)"
          >
            {{ contract.status }}
          </span>
        </div>
        <p class="text-sm text-gray-600 mb-2">{{ contract.contractNumber }}</p>
        <div class="flex items-center space-x-4 text-sm text-gray-600">
          <span class="font-medium">{{ formatCurrency(contract.contractValue, contract.currency) }}</span>
          <span 
            class="px-2 py-1 text-xs font-medium rounded-full"
            [class]="getRiskClass(contract.riskLevel)"
          >
            {{ contract.riskLevel }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
